<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EFF2F5">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Morning Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: an engineer's bench on graph paper. A 30-minute rail of four blocks, one open at a time; tabs for progress, n-back and setup. */
:root{
  --bg:#EFF2F5; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#121922; --muted:#5A6574; --line:#D6DCE4;
  --accent:#2A56DB; --accent-ink:#FFFFFF; --accent-soft:rgba(42,86,219,.10);
  --warm:#B96F06; --good:#1C8754; --bad:#C23E2C; --grid:rgba(42,86,219,.055);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C1117; --surface:#141B24; --surface-2:#19222D; --ink:#E4EAF1; --muted:#8B97A7; --line:#243040;
  --accent:#7E9CFF; --accent-ink:#0C1117; --accent-soft:rgba(126,156,255,.14);
  --warm:#F2A93B; --good:#4FC48C; --bad:#F2786A; --grid:rgba(126,156,255,.06); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0C1117; --surface:#141B24; --surface-2:#19222D; --ink:#E4EAF1; --muted:#8B97A7; --line:#243040;
  --accent:#7E9CFF; --accent-ink:#0C1117; --accent-soft:rgba(126,156,255,.14);
  --warm:#F2A93B; --good:#4FC48C; --bad:#F2786A; --grid:rgba(126,156,255,.06); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.55rem;font-weight:700}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1rem;font-weight:600;font-family:var(--f-body)}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);margin-bottom:20px}
.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px;padding-bottom:12px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font-family:var(--f-display);font-size:1.2rem;font-weight:700}
.sync{font-size:.75rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync[data-s="synced"] i{background:var(--good)}
.sync[data-s="error"] i,.sync[data-s="slow"] i{background:var(--warm)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs a{text-decoration:none;color:var(--muted);padding:6px 12px;border-radius:999px;font-weight:500;font-size:.9rem}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}

/* buttons & inputs */
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.small{padding:4px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=url],input[type=number],select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:110px;line-height:1.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:.8rem;color:var(--muted);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-size:.88rem}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* today header */
.today-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.clock{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 8px 8px 14px}
.clock .num{font-size:1.3rem;font-weight:600}

/* rail */
.rail{display:flex;flex-direction:column;gap:0;position:relative}
.step{display:grid;grid-template-columns:64px 1fr;gap:0 14px}
.step .mark{display:flex;flex-direction:column;align-items:center}
.step .dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-family:var(--f-mono);font-size:.8rem;font-weight:600;color:var(--muted);margin-top:14px}
.step .stem{flex:1;width:2px;background:var(--line);margin-top:4px}
.step:last-child .stem{display:none}
.step.done .dot{background:var(--good);border-color:var(--good);color:var(--surface)}
.step.open .dot{border-color:var(--accent);color:var(--accent)}
.step .mins{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);margin-top:4px;white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;min-width:0}
.card>header{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;flex-wrap:wrap}
.card>header h2{margin-right:auto}
.card .body{padding:0 16px 18px;display:flex;flex-direction:column;gap:14px}
.step:not(.open) .card .body{display:none}
.chip{font-size:.75rem;padding:2px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent);background:color-mix(in srgb,var(--good) 10%,transparent)}
.chip.warm{color:var(--warm);border-color:color-mix(in srgb,var(--warm) 40%,transparent);background:color-mix(in srgb,var(--warm) 10%,transparent)}
.chip.acc{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:var(--accent-soft)}
@media (max-width:560px){.step{grid-template-columns:40px 1fr;gap:0 8px}.step .mins{display:none}}

/* cube */
.scramble{font-family:var(--f-mono);font-size:1.02rem;background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;word-spacing:.2em;overflow-wrap:anywhere}
.pad{border:2px solid var(--line);border-radius:var(--r);background:var(--surface-2);padding:26px 12px;text-align:center;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none;width:100%}
.pad .num{font-size:clamp(2.6rem,9vw,4.2rem);font-weight:600;line-height:1}
.pad[data-p="holding"]{border-color:var(--bad)} .pad[data-p="holding"] .num{color:var(--bad)}
.pad[data-p="ready"]{border-color:var(--good)} .pad[data-p="ready"] .num{color:var(--good)}
.pad[data-p="running"] .num{color:var(--ink)}
.solves{display:flex;gap:8px;flex-wrap:wrap}
.solve{font-family:var(--f-mono);border:1px solid var(--line);border-radius:8px;padding:4px 4px 4px 10px;display:inline-flex;gap:6px;align-items:center;background:var(--surface)}
.solve button{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 6px;font-size:1rem}
.stats{display:flex;gap:22px;flex-wrap:wrap}
.stat .num{font-size:1.25rem;font-weight:600}

/* arithmetic */
.sprint{border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.sprint .bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.sprint .bar i{display:block;height:100%;background:var(--accent);width:100%;transform-origin:left}
.problem{font-family:var(--f-mono);font-size:clamp(2.2rem,8vw,3.4rem);font-weight:600;text-align:center;line-height:1.1;padding:12px 0 4px}
.answer{font-family:var(--f-mono);font-size:1.8rem;text-align:center;max-width:240px;margin:0 auto;display:block}
.sprint-top{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:1rem}
.slow{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:6px}
.slow span{white-space:nowrap}
.slow div{font-family:var(--f-mono);font-size:.88rem;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 8px;display:flex;justify-content:space-between;gap:8px}

/* timers */
.timer{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.timer .num{font-size:2rem;font-weight:600;min-width:5ch}
.timer.over .num{color:var(--bad)}
.note{border-left:3px solid var(--warm);background:color-mix(in srgb,var(--warm) 8%,transparent);padding:8px 12px;border-radius:0 8px 8px 0;font-size:.92rem}
.prompt{font-size:1.08rem;font-weight:500;background:var(--surface-2);border-radius:8px;padding:12px 14px;border:1px solid var(--line)}
.prompt small{display:block;color:var(--muted);font-weight:400;font-size:.85rem;margin-top:6px}

/* ai review */
.review{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--surface-2)}
.review .score{font-size:2.2rem;font-weight:600;line-height:1.1}
.crit{display:flex;flex-direction:column;gap:7px}
.crit>div{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr) 2.5ch;gap:10px;align-items:center;font-size:.9rem}
.crit i{height:8px;background:var(--line);border-radius:4px;overflow:hidden;display:block}
.crit b{display:block;height:100%;background:var(--accent);border-radius:4px}
.crit .weak span:first-child{color:var(--warm);font-weight:600}
.crit .weak b{background:var(--warm)}
.crit .num{text-align:right}
@media (max-width:560px){.crit>div{grid-template-columns:minmax(0,120px) minmax(0,1fr) 2.5ch}}
details summary{cursor:pointer;font-weight:500;color:var(--accent)}
.refans{white-space:pre-wrap;margin-top:8px;font-size:.92rem;max-width:70ch}
.spark{width:140px;height:28px;display:block}

/* progress */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile .num{font-size:1.6rem;font-weight:600;display:block}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;min-width:0}
.panel h2{margin-bottom:4px}
.chart{width:100%;height:auto;display:block;margin-top:10px}
.chart text{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.heat{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;grid-auto-columns:14px;gap:3px;margin-top:10px;overflow-x:auto;padding-bottom:4px}
.heat i{border-radius:3px;background:var(--surface-2);border:1px solid var(--line)}
.heat i[data-l="1"]{background:color-mix(in srgb,var(--accent) 30%,var(--surface));border-color:transparent}
.heat i[data-l="2"]{background:color-mix(in srgb,var(--accent) 55%,var(--surface));border-color:transparent}
.heat i[data-l="3"]{background:color-mix(in srgb,var(--accent) 78%,var(--surface));border-color:transparent}
.heat i[data-l="4"]{background:var(--accent);border-color:transparent}
.heat i[data-today]{outline:2px solid var(--ink);outline-offset:0}
.tablewrap{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.num{white-space:nowrap}
.empty{color:var(--muted);padding:18px;border:1px dashed var(--line);border-radius:8px;text-align:center;margin-top:10px}

/* n-back */
.nb-board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:330px;margin:0 auto;aspect-ratio:1;width:100%}
.nb-board i{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;font-family:var(--f-mono);font-size:1.6rem;font-weight:600;font-style:normal}
.nb-board i.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.nb-board i.center{background:transparent;border-style:dashed}
.nb-keys{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:420px;margin:0 auto;width:100%}
.nb-keys .btn{justify-content:center;padding:14px}
.nb-keys .btn.hit{background:var(--accent-soft);border-color:var(--accent)}
.prose{max-width:65ch}
.prose p{margin:.4em 0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><b>Morning Bench</b><span class="sync" id="sync" data-s="local"><i></i><span>Saved in this browser</span></span></div>
    <nav class="tabs" aria-label="Sections">
      <a href="#today" data-tab="today">Today</a>
      <a href="#progress" data-tab="progress">Progress</a>
      <a href="#nback" data-tab="nback">N-back</a>
      <a href="#setup" data-tab="setup">Setup</a>
    </nav>
  </div>
</header>

<main class="wrap" id="app"></main>

<script>
(() => {
'use strict';
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2 = n => String(n).padStart(2, '0');
const keyOf = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const todayKey = () => keyOf(new Date());
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clone = o => JSON.parse(JSON.stringify(o));
const fmtMs = ms => { if (ms == null || !isFinite(ms)) return '–'; const s = ms / 1000; if (s < 60) return s.toFixed(2); const m = Math.floor(s / 60); return m + ':' + (s - m * 60).toFixed(2).padStart(5, '0'); };
const fmtClock = ms => { ms = Math.max(0, ms); const t = Math.ceil(ms / 1000); return Math.floor(t / 60) + ':' + pad2(t % 60); };
const fmtElapsed = ms => { const t = Math.floor(Math.max(0, ms) / 1000); return Math.floor(t / 60) + ':' + pad2(t % 60); };
const shortDate = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString(undefined, {month: 'short', day: 'numeric'}); };
const isTyping = () => { const a = document.activeElement; return a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' || a.isContentEditable); };

let audioCtx = null;
function beep(freq = 880, dur = 0.15, times = 1) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    for (let i = 0; i < times; i++) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = freq; o.type = 'sine';
      const t0 = audioCtx.currentTime + i * (dur + 0.08);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.2, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g).connect(audioCtx.destination); o.start(t0); o.stop(t0 + dur + 0.02);
    }
  } catch (e) {}
}

/* ---------- content banks ---------- */
const DRILLS = {
  fermi: { name: 'Fermi estimate', how: 'Write your assumptions as a chain of numbers, get an answer within 10×, then name the assumption you trust least.', prompts: [
    'How much new storage does YouTube need per day?',
    'How many GPUs would it take to give every Google search an LLM-written answer?',
    'How many emails are sent worldwide every second?',
    'How many requests per second does a ride-share app handle at peak in one big city?',
    'How many lines of code ship in a modern car?',
    'How much electricity does one data center use in a year, and how many homes is that?',
    'How many piano-sized shipping containers pass through the Port of Los Angeles each day?',
    'How many bytes of text are posted to social media worldwide per day?',
    'How many Wi-Fi access points are there in New York City?',
    'How many hours of human labor go into building one commercial airliner?'
  ]},
  design: { name: 'Back-of-the-envelope design', how: 'Estimate QPS, storage and bandwidth first. Sketch the boxes, then find the one component that breaks first at 10× load.', prompts: [
    'A URL shortener taking 100M new links a month.',
    'A rate limiter in front of an API with 10k clients and bursty traffic.',
    'A chat app with 50M daily users: messages per second and storage per year.',
    'A news feed for 200M users. Fan-out on write or on read?',
    'A global leaderboard for a mobile game with 10M players.',
    'A photo upload service: upload bandwidth, storage growth and CDN cost.',
    'A notification system sending 1B pushes a day.',
    'A metrics pipeline ingesting 1M data points per second.',
    'Typeahead search suggestions for a site with 5k QPS.',
    'A distributed job scheduler that runs 10M cron jobs a day.'
  ]},
  postmortem: { name: 'Post-mortem breakdown', how: 'From memory or a quick read: what failed, why nothing caught it, how it was detected, and the single change you would have made first.', prompts: [
    'Cloudflare, July 2, 2019: one regular expression took down the edge.',
    'AWS S3 us-east-1, February 28, 2017: a mistyped command removed too many servers.',
    'GitLab, January 31, 2017: a production database was deleted and backups failed.',
    'Knight Capital, August 1, 2012: a stale feature flag lost $440M in 45 minutes.',
    'Facebook, October 4, 2021: a BGP change took every service offline.',
    'CrowdStrike, July 19, 2024: a content update crashed Windows machines worldwide.',
    'Fastly, June 8, 2021: one customer config change triggered a global outage.',
    'Atlassian, April 2022: a script deleted sites for about 400 customers for up to two weeks.',
    'A bug you shipped yourself. Write it up as if it were public.'
  ]},
  paper: { name: 'Paper summary', how: 'Three sentences: the problem, the key idea, the trade-off. Then one question you still have.', prompts: [
    'Dynamo: Amazon’s Highly Available Key-value Store (2007)',
    'MapReduce: Simplified Data Processing on Large Clusters (2004)',
    'The Google File System (2003)',
    'In Search of an Understandable Consensus Algorithm, the Raft paper (2014)',
    'Attention Is All You Need (2017)',
    'Spanner: Google’s Globally-Distributed Database (2012)',
    'Time, Clocks, and the Ordering of Events in a Distributed System (Lamport, 1978)',
    'End-to-End Arguments in System Design (1984)',
    'The Log: What every software engineer should know about real-time data (Kreps, 2013)',
    'Bigtable: A Distributed Storage System for Structured Data (2006)'
  ]},
  redo: { name: 'Redo a missed problem', how: 'Re-solve a problem you didn’t finish cleanly, from a blank editor, without looking at your notes until you are done.', prompts: [] },
  explain: { name: 'Explain it simply', how: 'Pick something you use at work and explain how it really works to a smart 12-year-old. Every gap you hit is something to look up.', prompts: [
    'How does TLS keep a connection private?', 'What actually happens when you type a URL and press Enter?', 'How does a hash map stay fast as it grows?',
    'How does garbage collection decide what to free?', 'How does a B-tree index make a query fast?', 'How does git store history?',
    'How does a CPU cache make code faster?', 'How does gradient descent train a model?'
  ]},
  review: { name: 'Weekly review', how: 'Look at this week on the Progress tab. Which block improved, which stalled, and what is one change for next week?', prompts: [
    'Review the week: trends, misses and one change for next week.'
  ]}
};
// Day of week -> drill. 0 = Sunday. Weekend picks are a guess.
const ROTATION = {1: 'fermi', 2: 'design', 3: 'postmortem', 4: 'paper', 5: 'redo', 6: 'explain', 0: 'review'};

/* ---------- AI review rubrics (fixed; bump v when a rubric changes) ---------- */
const GRADER_VERSION = 'g1';
const RUBRICS = {
  fermi: { v: 'fermi-1', c: [

}

let db = null;

async function initDb() {

const sprint = { running: false, endAt: 0, score: 0, cur: null, t0: 0, log: [], raf: 0, last: null, kind: 'normal', secs: 120, pool: [], recent: [] };

function lineChart(pts, opts = {}) {
  if (pts.length < 2) return `<div class="empty">${pts.length ? 'One day logged so far. The chart appears after your second day.' : esc(opts.empty || 'No data yet.')}</div>`;
  const W = 640, H = 180, L = 44, R = 14, T = 14, B = 26;
  const ys = pts.map(p => p.y);

  const padv = (hi - lo) * 0.1; lo -= padv; hi += padv;

  const x = i => L + (W - L - R) * (i / (pts.length - 1));
  const y = v => opts.invert ? T + (H - T - B) * ((v - lo) / (hi - lo)) : H - B - (H - T - B) * ((v - lo) / (hi - lo));
  const ticks = [lo + (hi - lo) * 0.1, (lo + hi) / 2, hi - (hi - lo) * 0.1];

  const last = pts[pts.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || 'Chart')}">
    ${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" style="stroke:var(--line)" stroke-width="1"/><text x="${L - 6}" y="${(y(t) + 4).toFixed(1)}" text-anchor="end">${esc(fmt(t))}</text>`).join('')}
    <path d="${area}" style="fill:var(--accent-soft)"/>
    <path d="${line}" fill="none" style="stroke:var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p.y).toFixed(1)}" r="${i === pts.length - 1 ? 4.5 : 2.5}" style="fill:${i === pts.length - 1 ? 'var(--accent)' : 'var(--surface)'};stroke:var(--accent)" stroke-width="1.5"><title>${esc(p.label)}: ${esc(fmt(p.y))}</title></circle>`).join('')}
    <text x="${x(0)}" y="${H - 6}" text-anchor="start">${esc(pts[0].label)}</text>
    <text x="${x(pts.length - 1)}" y="${H - 6}" text-anchor="end">${esc(last.label)} · ${esc(fmt(last.y))}</text>
  </svg>`;
}

  clearTimeout(nb.timer); nb.running = false;
  if (aborted) { nb.result = null; renderNback($('#app')); return; }
  const sc = (match, resp) => { let h = 0, m = 0, f = 0; nb.trials.forEach((t, i) => { if (i < nb.n) { if (resp(t)) f++; return; } const isM = match(t, nb.trials[i - nb.n]); if (isM && resp(t)) h++; else if (isM) m++; else if (resp(t)) f++; }); return {h, m, f, acc: Math.round(100 * h / Math.max(1, h + m + f))}; };
  const pos = sc((t, p) => t.p === p.p, t => t.rp), aud = sc((t, p) => t.a === p.a, t => t.ra);
  let move = 'Stay at this level';
  if (pos.acc >= 80 && aud.acc >= 80) { S.settings.nback.n = Math.min(9, nb.n + 1); move = 'Moved up a level'; }
  else if (pos.acc < 50 || aud.acc < 50) { S.settings.nback.n = Math.max(1, nb.n - 1); move = nb.n > 1 ? 'Moved down a level' : move; }
  saveSettings();
  const d = day(); d.nback.rounds.push({n: nb.n, posAcc: pos.acc, audAcc: aud.acc, at: Date.now()}); saveDay();
  nb.result = {pos, aud, posAcc: pos.acc, audAcc: aud.acc, move};
  beep(660, 0.12, 2);
  renderNback($('#app'));
}

/* ---------- SETUP ---------- */
function renderSetup(app) {
  const c = S.settings.arith;
  const rng = (id, label, v) => `<div class="field"><span>${label}</span><div class="row" style="gap:6px;flex-wrap:nowrap"><input type="number" id="${id}0" value="${v[0]}" min="0" max="9999"><span class="muted">to</span><input type="number" id="${id}1" value="${v[1]}" min="0" max="9999"></div></div>`;
  app.innerHTML = `
    <div class="today-head"><div><div class="label">Setup</div><h1>Tune the routine</h1></div></div>
    <div class="panel" style="display:flex;flex-direction:column;gap:14px">
      <h2>Arithmetic sprint</h2>
      <div class="row">${[['add', 'Addition'], ['sub', 'Subtraction'], ['mul', 'Multiplication'], ['div', 'Division']].map(([k, t]) => `<label class="row" style="gap:6px"><input type="checkbox" id="op-${k}" ${c.ops[k] ? 'checked' : ''}> ${t}</label>`).join('')}</div>
      <div class="grid2">${rng('addA', 'Addition, first number', c.addA)}${rng('addB', 'Addition, second number', c.addB)}${rng('mulA', 'Multiplication, first number', c.mulA)}${rng('mulB', 'Multiplication, second number', c.mulB)}</div>
      <p class="muted" style="margin:0;font-size:.88rem">Subtraction uses the addition ranges in reverse, and division uses the multiplication ranges in reverse, so every answer is a whole number.</p>
      <div class="grid2">
        <label class="field"><span>Round length</span><select id="dur">${[30, 60, 90, 120, 180, 300].map(s => `<option value="${s}" ${s === c.duration ? 'selected' : ''}>${s} seconds</option>`).join('')}</select></label>
        <label class="field"><span>Round plan</span><select id="plan"><option value="drill" ${c.drillRound ? 'selected' : ''}>Normal, slow-problem drill, normal</option>${[1, 2, 3, 4].map(s => `<option value="${s}" ${!c.drillRound && s === c.rounds ? 'selected' : ''}>${s} normal round${s > 1 ? 's' : ''}</option>`).join('')}</select></label>
        <label class="field"><span>Slow-problem drill length</span><select id="drillSecs">${[30, 45, 60, 90].map(s => `<option value="${s}" ${s === (c.drillSecs || 60) ? 'selected' : ''}>${s} seconds</option>`).join('')}</select></label>
      </div>
      <p class="muted" style="margin:0;font-size:.88rem">The drill round brings back the 8 slowest problems from your earlier rounds that morning and mixes them about half and half with fresh ones. It counts separately from your best score.</p>
    </div>
    <div class="panel" style="display:flex;flex-direction:column;gap:14px">
      <h2>Blocks</h2>
      <div class="grid2">
        <label class="field"><span>Cube solves per morning</span><select id="cubeTarget">${[1, 2, 3, 5].map(s => `<option ${s === S.settings.cubeTarget ? 'selected' : ''}>${s}</option>`).join('')}</select></label>
        <label class="field"><span>LeetCode cap (minutes)</span><select id="leetMin">${[10, 15, 20, 25, 30].map(s => `<option ${s === S.settings.leetMin ? 'selected' : ''}>${s}</option>`).join('')}</select></label>
        <label class="field"><span>Drill length (minutes)</span><select id="drillMin">${[5, 7, 10, 15].map(s => `<option ${s === S.settings.drillMin ? 'selected' : ''}>${s}</option>`).join('')}</select></label>
      </div>
      <div><div class="label">Drill rotation</div><div class="tablewrap"><table><tbody>${[1, 2, 3, 4, 5, 6, 0].map(i => `<tr><td>${['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][i]}</td><td>${esc(DRILLS[ROTATION[i]].name)}</td></tr>`).join('')}</tbody></table></div></div>
    </div>
    ${hasClaudeRuntime() ? '' : `<div class="panel" style="display:flex;flex-direction:column;gap:12px" id="apiPanel">
      <h2>AI review</h2>
      <p class="muted prose" style="margin:0">Drill reviews here use your own Anthropic API key and are billed to your API account, usually a few cents per review. The key is stored only in this browser and sent only to api.anthropic.com. Other pages on this same github.io domain could read it, so use a key with a low spend limit.</p>
      ${apiKey() ? `<div class="row"><span class="chip good">Key saved</span><span class="mono">${esc(apiKey().slice(0, 10))}…${esc(apiKey().slice(-4))}</span><button class="btn small" id="keyRemove">Remove key</button></div>`
        : `<div class="row" style="flex-wrap:nowrap"><input type="password" id="keyInput" data-local autocomplete="off" spellcheck="false" placeholder="sk-ant-…" aria-label="Anthropic API key"><button class="btn primary" id="keySave">Save key</button></div>
           <div class="muted" style="font-size:.85rem">Create one at <a href="https://platform.claude.com/settings/keys" target="_blank" rel="noopener">platform.claude.com</a>.</div>`}
      <label class="field" style="max-width:340px"><span>Grading model</span><select id="apiModel" data-local>${API_MODELS.map(([v, t]) => `<option value="${v}" ${v === apiModel() ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></label>
    </div>`}
    <p class="muted" style="font-size:.85rem">Changes save as you make them.</p>`;
  const num = (id, fb) => { const v = parseInt($(id).value, 10); return isFinite(v) ? Math.max(0, Math.min(9999, v)) : fb; };
  const save = () => {
    const a = S.settings.arith;
    ['add', 'sub', 'mul', 'div'].forEach(k => a.ops[k] = $('#op-' + k).checked);
    if (!Object.values(a.ops).some(Boolean)) { a.ops.add = true; $('#op-add').checked = true; }
    ['addA', 'addB', 'mulA', 'mulB'].forEach(k => { a[k] = [num('#' + k + '0', a[k][0]), num('#' + k + '1', a[k][1])]; });
    a.duration = +$('#dur').value; const pv = $('#plan').value; a.drillRound = pv === 'drill'; if (pv !== 'drill') a.rounds = +pv; a.drillSecs = +$('#drillSecs').value;
    S.settings.cubeTarget = +$('#cubeTarget').value; S.settings.leetMin = +$('#leetMin').value; S.settings.drillMin = +$('#drillMin').value;
    leetT.left = null; drillT.left = null;
    saveSettings();
  };
  $$('input:not([data-local]),select:not([data-local])', app).forEach(el => el.addEventListener('change', save));
  const ks = $('#keySave', app);
  if (ks) ks.onclick = () => { const v = $('#keyInput').value.trim(); if (!v) return; lsSet(KEY_LS, v); renderSetup(app); };
  const ki = $('#keyInput', app); if (ki) ki.addEventListener('keydown', e => { if (e.key === 'Enter') ks.click(); });
  const kr = $('#keyRemove', app); if (kr) kr.onclick = () => { lsSet(KEY_LS, ''); renderSetup(app); };
  const am = $('#apiModel', app); if (am) am.onchange = () => lsSet(MODEL_LS, am.value);
}

/* ---------- boot ---------- */
window.addEventListener('hashchange', route);
route();
initDb();
initSample();
})();
</script>
